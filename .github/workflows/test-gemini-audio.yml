name: Test Gemini audio roundtrip

on:
  push:
    branches:
      - test/gemini-audio-roundtrip

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Gemini audio pipeline
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yemot-voice-ai-new.onrender.com"
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/api/test-gemini-audio.wav" -o gemini-hebrew-test.wav
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/api/test-gemini-audio-roundtrip" -o roundtrip.json
          echo "ROUNDTRIP_RESULT:"
          cat roundtrip.json
          echo
          echo "AUDIO_FILE:"
          file gemini-hebrew-test.wav
          ls -lh gemini-hebrew-test.wav

      - name: Save tested WAV as a branch artifact file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini-hebrew-test.wav
          git commit -m "Add tested Gemini Hebrew WAV [skip ci]"
          git push origin HEAD:test/gemini-audio-roundtrip
