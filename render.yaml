services:
  - type: web
    name: ai-phone-line-branch3
    runtime: node
    plan: free
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEYS
        sync: false
      - key: ZMANIM_TRANSCRIPTION_GEMINI_KEY
        sync: false
      - key: YEMOT_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3-flash-preview,gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      - key: MODEL_COOLDOWN_MS
        value: "3600000"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: REQUEST_TIMEOUT_MS
        value: "55000"
      - key: PER_MODEL_TIMEOUT_MS
        value: "20000"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/.cache/puppeteer